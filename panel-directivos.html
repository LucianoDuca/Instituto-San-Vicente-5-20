<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/Sanvi Logos/logo.webp" type="image/png">
  <title>Panel Directivos | Instituto San Vicente</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/panel-admin.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>

  <main class="panel-page">
    <section class="panel-card">

      <div class="panel-top">
        <div>
          <span class="panel-kicker">ENTORNO DIRECTIVO</span>
          <h1>Portal Directivos</h1>
          <p id="userInfo" class="panel-user">Cargando...</p>
        </div>
        <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
      </div>

      <div class="panel-tabs">
        <button class="tab-btn active" data-tab="comunicados">
          Comunicados <span class="tab-badge" id="commsBadge"></span>
        </button>
        <button class="tab-btn" data-tab="biblioteca">
          Biblioteca <span class="tab-badge" id="docsBadge"></span>
        </button>
      </div>

      <div id="tab-comunicados" class="tab-panel active">
        <div class="two-columns">
          <div class="admin-card">
            <h2>Publicar comunicado</h2>
            <form id="createAnnouncementForm" class="admin-form">
              <input type="text" name="titulo" placeholder="Título del comunicado" required />
              <textarea name="contenido" placeholder="Contenido del comunicado" required></textarea>

              <select name="rol_visible" required>
                <option value="todos">Todos</option>
                <option value="directivo">Directivos</option>
                <option value="docente">Docentes</option>
              </select>

              <p id="announcementStatus" class="status"></p>
              <button id="createAnnouncementBtn" type="submit">Publicar comunicado</button>
            </form>
          </div>

          <div class="admin-card">
            <div class="card-head">
              <h2>Comunicados</h2>
            </div>
            <div id="announcementsContainer" class="announcements-list"></div>
          </div>
        </div>
      </div>

      <div id="tab-biblioteca" class="tab-panel">

        <div class="doc-toolbar">
          <button type="button" id="toggleCreateDocumentBtn">Cargar documento</button>
          <input id="documentSearch" class="doc-search" type="search" placeholder="Buscar documento..." />
          <p id="docCount" class="doc-count"></p>
        </div>

        <div class="modal-overlay" id="documentModal">
          <div class="modal-box">
            <button type="button" class="modal-close" id="closeDocumentModalBtn" aria-label="Cerrar">✕</button>
            <h2 id="documentFormTitle">Cargar documento</h2>

            <form id="createDocumentForm" class="admin-form">
              <input type="hidden" name="id" id="documentId" />
              <input type="text" name="titulo" placeholder="Título del documento" required />
              <textarea name="descripcion" placeholder="Descripción"></textarea>

              <select name="categoria" required>
                <option value="Decreto">Decreto</option>
                <option value="Reglamento">Reglamento</option>
                <option value="Planificación">Planificación</option>
                <option value="Material docente">Material docente</option>
                <option value="Circular">Circular</option>
                <option value="Documento institucional">Documento institucional</option>
              </select>

              <select name="nivel" required>
                <option value="General">General</option>
                <option value="Inicial">Inicial</option>
                <option value="Primario">Primario</option>
                <option value="Secundario">Secundario</option>
              </select>

              <select name="area" required>
                <option value="Institucional">Institucional</option>
                <option value="Educación Física">Educación Física</option>
                <option value="Inglés">Inglés</option>
                <option value="Arte">Arte</option>
                <option value="Matemática">Matemática</option>
                <option value="Lengua">Lengua</option>
                <option value="Ciencias">Ciencias</option>
                <option value="Administración">Administración</option>
              </select>

              <select name="rol_visible" required>
                <option value="todos">Todos</option>
                <option value="directivo">Directivos</option>
                <option value="docente">Docentes</option>
              </select>

              <div class="cs-upload-zone">
                <input type="file" id="documentFileInput" class="cs-file-input" />
                <label for="documentFileInput" class="cs-upload-label">
                  <span id="documentUploadText">📎 Elegir archivo (imagen, PDF, Word, Excel...)</span>
                </label>
              </div>

              <p class="hint">O pegá un enlace externo (ej. Google Drive) en vez de subir un archivo:</p>
              <input type="url" name="drive_url" id="documentDriveUrl" placeholder="https://drive.google.com/..." />

              <p id="documentStatus" class="status"></p>

              <div class="form-actions">
                <button id="createDocumentBtn" type="submit">Guardar documento</button>
                <button id="cancelEditDocumentBtn" type="button" class="secondary hidden">Cancelar edición</button>
              </div>
            </form>
          </div>
        </div>

        <div class="filters-grid">
          <div class="filter-box">
            <label>Nivel</label>
            <select id="nivelFilter">
              <option value="">Todos</option>
              <option value="General">General</option>
              <option value="Inicial">Inicial</option>
              <option value="Primario">Primario</option>
              <option value="Secundario">Secundario</option>
            </select>
          </div>

          <div class="filter-box">
            <label>Área</label>
            <select id="areaFilter">
              <option value="">Todas</option>
              <option value="Institucional">Institucional</option>
              <option value="Administración">Administración</option>
              <option value="Educación Física">Educación Física</option>
              <option value="Inglés">Inglés</option>
              <option value="Arte">Arte</option>
              <option value="Matemática">Matemática</option>
              <option value="Lengua">Lengua</option>
              <option value="Ciencias">Ciencias</option>
            </select>
          </div>

          <div class="filter-box">
            <label>Categoría</label>
            <select id="categoriaFilter">
              <option value="">Todas</option>
              <option value="Decreto">Decreto</option>
              <option value="Reglamento">Reglamento</option>
              <option value="Circular">Circular</option>
              <option value="Documento institucional">Documento institucional</option>
              <option value="Planificación">Planificación</option>
              <option value="Material docente">Material docente</option>
            </select>
          </div>
        </div>

        <div id="documentsContainer" class="documents-grid"></div>

      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/panel-directivos.js"></script>

</body>
</html>
